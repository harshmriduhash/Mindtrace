services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mindtrace
      POSTGRES_PASSWORD: mindtrace
      POSTGRES_DB: mindtrace
    ports:
      - "5432:5432"
    volumes:
      - mindtrace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindtrace -d mindtrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mindtrace
      MINIO_ROOT_PASSWORD: mindtrace_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mindtrace_minio:/data

volumes:
  mindtrace_pg:
  mindtrace_minio:
